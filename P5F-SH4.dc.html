  __json(k, d) { try { const o = JSON.parse(this.__get(k) || 'null'); if (o && typeof o === 'object') return Array.isArray(o) ? o : Object.assign({}, d, o); } catch (e) {} return d; }
  __open() {
    let ref = '', nav = 'navigate', hash = '';
    try { ref = String(document.referrer || '').split('#')[0].split('?')[0].split('/').pop() || ''; } catch (e) {}
    try { nav = (window.performance.getEntriesByType('navigation')[0] || {}).type || 'navigate'; } catch (e) {}
    try { hash = String(window.location.hash || ''); } catch (e) {}

    if (this.__get('p5fsh4sheet') !== '0') return true;
    return nav === 'navigate' && /^P5F-(SH1|SH2|SH3|SH6|SO8)\.dc\.html$/.test(ref);
  }

    super(props);
    const add = this.__json('p5fadd', { rosi: true, karl: false });

  }

  }
