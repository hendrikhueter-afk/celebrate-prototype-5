<script>(function(){var lw=0;function f(){var w=innerWidth,h=innerHeight;if(w===lw)return;lw=w;var z=w/390,H=h/z;if(H<640){z=h/640;H=640}var r=document.documentElement.style;r.setProperty("--z",z);r.setProperty("--h",Math.floor(H)+"px")}f();addEventListener("resize",f);addEventListener("orientationchange",function(){lw=0;setTimeout(f,300)})})();</script>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&amp;display=swap">
<style>
img{filter:saturate(1.1) brightness(1.12) contrast(1.05)}
body{margin:0;background:#FFFFFF}
a{color:#2E1712;text-decoration:none}a:hover{color:#2E1712}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#2E1712;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;background:#4E2018;color:#ffffff;font-weight:700;font-size:16px;border:0;font-family:inherit;cursor:pointer;text-decoration:none;box-sizing:border-box}
.btn:hover{color:#ffffff}
/* the double page on top answers every control below at once: margins and gaps follow Seitenlayout, the number of photos follows Fotos pro Seite, the caption follows Textfelder */
.pv{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 0 14px;border-radius:16px;background:#F7F6F5}
.pv .sp{position:relative;display:flex;overflow:hidden;background:#FFFFFF;border-radius:2px;box-shadow:0 0 0 0.5px rgba(0,0,0,0.12),0 8px 22px rgba(40,28,28,0.18)}
.pv .sp::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;margin-left:-7px;background:linear-gradient(to right,rgba(46,23,18,0),rgba(46,23,18,0.10) 50%,rgba(46,23,18,0));pointer-events:none}
.pv .pg{width:146px;height:190px;box-sizing:border-box;display:flex;flex-direction:column;padding:var(--m);gap:var(--g);transition:padding .22s ease,gap .22s ease}
.pv .ph{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--g);transition:gap .22s ease}
.pv .s{position:relative;overflow:hidden;min-width:0;min-height:0;background:#EFEAE6}
.pv .s img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .22s ease}
/* Automatisch füllen off: the pages stay empty, nothing is laid out and there is no page count to show */
.pv[data-auto="0"] .s img{opacity:0}
.pv[data-auto="0"] .cap,.pv[data-auto="0"] .pc{visibility:hidden}
.pv .cap{display:none;flex-shrink:0;height:10px;font-size:7px;line-height:10px;font-weight:500;color:#2E1712;white-space:nowrap}
.pv[data-txt="1"] .cap{display:block}
.pv[data-lay="0"]{--m:16px;--g:8px}
.pv[data-lay="1"]{--m:9px;--g:4px}
.pv[data-lay="2"]{--m:0px;--g:2px}
.pv[data-lay="2"] .cap{padding:0 6px 4px}
.pv[data-ppp="0"] .s:nth-child(n+2),.pv[data-ppp="1"] .pg:first-child .s:nth-child(n+2),.pv[data-ppp="1"] .s:nth-child(n+3),.pv[data-ppp="2"] .s:nth-child(n+3),.pv[data-ppp="3"] .s:nth-child(n+4){display:none}
.pv[data-ppp="0"] .s:first-child,.pv[data-ppp="1"] .pg:first-child .s:first-child{grid-area:1 / 1 / 3 / 3}
.pv[data-ppp="1"] .pg:last-child .s,.pv[data-ppp="2"] .s,.pv[data-ppp="3"] .s:first-child{grid-column:1 / 3}
.pv .pc{font-size:14px;line-height:20px;color:#6F5A52}
/* same row card as on B2a; here the rows carry their control instead of a chevron */
.rows{display:flex;flex-direction:column;border:1.5px solid #E2D9D6;border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 12px 12px 14px;margin:0;border:0;box-sizing:border-box;background:#FFFFFF;color:#2E1712;font-family:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
button.row{cursor:pointer}
.row+.row{border-top:1px solid #E8E5E3}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
.row .lb{font-size:13px;line-height:18px;color:#6F5A52}
.row .vl{flex:1;font-size:16px;line-height:22px;font-weight:700}
.rows.noauto [data-ao]{opacity:.38;pointer-events:none}
.sw{position:relative;display:block;width:50px;height:30px;border-radius:15px;background:#A8958D;flex-shrink:0;transition:background-color .16s ease}
.sw span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(46,23,18,0.25);transition:transform .16s ease}
[aria-checked="true"] .sw{background:#4E2018}
[aria-checked="true"] .sw span{transform:translateX(20px)}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:#F7F6F5}
.seg .pl{flex:1 1 0;min-width:0;height:44px;padding:0;margin:0;border:0;border-radius:9px;background:none;color:#6F5A52;font-family:inherit;font-size:13px;line-height:18px;font-weight:400;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .14s ease,color .14s ease}
.seg .pl[aria-pressed="true"]{background:#FFFFFF;color:#2E1712;font-weight:700;box-shadow:inset 0 0 0 1.5px #4E2018}

        <button type="button" class="pl" data-k="ppp" data-v="3" aria-pressed="true">Mittel</button>
        <button type="button" class="pl" data-k="ppp" data-v="4" aria-pressed="false">Hoch</button>
      </div>
    </div>
    <button type="button" role="switch" class="row" data-ao="" data-sw="txt" aria-checked="true"><span class="vl">Textfelder</span><span class="sw" aria-hidden="true"><span></span></span></button>
  </div>
</div>
