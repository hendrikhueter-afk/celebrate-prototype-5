body{margin:0;background:#FFFFFF}
a{color:#2E1712;text-decoration:none}a:hover{color:#2E1712}

.sheet.b{left:120px;top:18px;width:230px;height:140px;transform:rotate(5deg)}

.satin .sheet.b{background:linear-gradient(118deg,#FFFFFF 0,#FFFFFF 38%,#EDEFF2 47%,#FFFFFF 56%,#F4F5F7 72%,#FFFFFF 100%)}
