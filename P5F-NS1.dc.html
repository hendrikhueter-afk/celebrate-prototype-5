<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}

.nsopt{transition:transform 0.12s ease, background-color 0.12s ease, opacity 0.16s ease}.nsopt:active{transform:scale(0.97);background:#E9E6E4}

<div style="width: 390px; height: var(--h, 844px); box-sizing: border-box; background: #FFFFFF; color: #2E1712; font-family: 'Rubik', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 44px; height: 44px; padding: 0 14px; display: flex; align-items: center; z-index: 4"><a href="P5-sammlungen.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2E1712"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; stroke-width: 2.2"><path d="M15 5l-7 7 7 7"></path></svg></a></div>
<div style="position: absolute; left: 20px; right: 20px; top: 104px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; color: #2E1712; text-align: center">Neue Sammlung</h1>
<input id="p5f-ns-name" class="nsname" type="text" placeholder="Name" aria-label="Name" autocomplete="off" spellcheck="false" maxlength="40" enterkeyhint="done" onInput="{{onName}}" onKeyDown="{{onKey}}" style="display: block; width: 100%; height: 56px; box-sizing: border-box; padding: 0 18px; border: 0; border-radius: 16px; background: #F2F1F0; font-family: inherit; font-size: 17px; line-height: 22px; color: #2E1712; caret-color: #4E2018; outline: none">

<a href="P5F-NS4.dc.html" onClick="{{goSelf}}" aria-disabled="{{dis}}" class="nsopt" style="aspect-ratio: 4 / 5; border-radius: 22px; background: #F2F1F0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; box-sizing: border-box; text-align: center; opacity: {{op}}"><span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; color: #4E2018; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" style="width: 30px; height: 30px; stroke-width: 1.7"><path d="M22 14a8 8 0 0 1-8 8"></path><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"></path><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"></path><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"></path><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg></span><span style="font-size: 17px; line-height: 22px; font-weight: 700; color: #2E1712">Selbst auswählen</span></a>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // New Sammlung, one screen (Hendrik, 19 Nov): the name, then the choice how it fills. Tapping a choice continues.
  // Until a name is typed the two choices are dimmed; tapping one then puts the cursor into the name field.
  // The name goes to sessionStorage p5fnsname (read by P5F-NS3 and P5F-NS4).
  // Automatisch: P5F-NS3 (who, where, what). Selbst auswählen: the empty Sammlung P5F-NS4 (p5fnsauto cleared).
  // Either way a new Sammlung starts without picked photos (p5fpicked cleared) and without old picks (p5fnsauto cleared).
  constructor(props) { super(props); this.state = { has: false }; }
  __el() { try { return document.getElementById('p5f-ns-name'); } catch (e) { return null; } }
  __typed() { const n = this.__el(); return n ? String(n.value || '').replace(/\s+/g, ' ').trim() : ''; }
  __from() { try { return String(document.referrer || '').split('#')[0].split('?')[0].split('/').pop() || ''; } catch (e) { return ''; } }
  componentDidMount() {
    // back from P5F-NS3: show the name again; any other way in starts a fresh Sammlung
    const n = this.__el(); let keep = '';
    try { if (this.__from() === 'P5F-NS3.dc.html') keep = window.sessionStorage.getItem('p5fnsname') || ''; else window.sessionStorage.removeItem('p5fnsname'); } catch (e) {}
    if (n && keep) { n.value = keep; this.setState({ has: true }); }
  }
  __go(e, auto) {
    const v = this.__typed();
    if (!v) { if (e && e.preventDefault) e.preventDefault(); const n = this.__el(); if (n) n.focus(); return; }
    try { window.sessionStorage.setItem('p5fnsname', v); window.sessionStorage.removeItem('p5fpicked'); window.sessionStorage.removeItem('p5fnsauto'); } catch (x) {}
  }
  renderVals() {
    const self = this; const has = !!this.state.has;
    return {
      op: has ? '1' : '0.35', dis: has ? 'false' : 'true',
      onName: function () { const v = self.__typed(); try { if (v) window.sessionStorage.setItem('p5fnsname', v); else window.sessionStorage.removeItem('p5fnsname'); } catch (e) {} if (!!v !== self.state.has) self.setState({ has: !!v }); },
      onKey: function (e) { if (e && e.key === 'Enter') { if (e.preventDefault) e.preventDefault(); const n = self.__el(); if (n) n.blur(); } },
      goAuto: function (e) { self.__go(e, true); },
      goSelf: function (e) { self.__go(e, false); }
    };
  }
}
</script>
