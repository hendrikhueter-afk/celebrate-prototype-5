<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // "Neues Buch", opened from the plus on the Bücher tab; a sibling of P5F-NS3 ("Welche Fotos?") built from its elements.
  // Three filters that combine (Hendrik, 23 Nov): who (the NS3 face row, several), when (the NS3 Von and Bis rows with the
  // calendar sheet; empty Von = from the start, empty Bis = forever) and one Sammlung (the P5-sammlungen tiles in one row that
  // scrolls sideways; tap again to untick). Every pick is optional: "Buch erstellen" always works, no pick = a book from all photos.
  // It opens the editor P5-BK-edit; nothing is passed on (the editor shows Hannes erstes Jahr).
  // Entry from an album: P5-BK-neu.dc.html#sammlung=<id> (hanne, theo, familie, daenemark) starts with that tile ticked.
  // Faces and tiles are written out in the markup (no image template, so no request for a placeholder address).
  __cols() { return ['hanne', 'theo', 'familie', 'daenemark']; }
  __people() { return ['hanne', 'theo', 'lukas', 'ich']; }

  // Own date picker (the sheet from P5F-NS3): the native picker does not open inside the canvas or the click-through frame.

  __open(which) { const v = this.state[which] || this.state.from || this.state.to; const t = new Date(); this.setState({ open: which, ym: v ? v.slice(0, 7) : t.getFullYear() + '-' + this.__pad(t.getMonth() + 1) }); }
  __shift(ym, by) { const p = String(ym).split('-'); const d = new Date(Number(p[0]), Number(p[1]) - 1 + by, 1); return d.getFullYear() + '-' + this.__pad(d.getMonth() + 1); }
  __cal() {
    const self = this; const st = this.state; if (!st.open || !st.ym) return { month: '', days: [] };
    const p = st.ym.split('-'); const y = Number(p[0]); const m = Number(p[1]) - 1;
    const names = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const lead = (new Date(y, m, 1).getDay() + 6) % 7; const count = new Date(y, m + 1, 0).getDate(); const sel = st[st.open]; const days = [];
    for (let i = 0; i < lead; i++) days.push({ n: '', label: '', pressed: 'false', vis: 'hidden', bg: 'transparent', fg: '#2E1712', fw: '400', tap: function () {} });
    for (let d = 1; d <= count; d++) { const iso = st.ym + '-' + self.__pad(d); const on = iso === sel;
      const off = st.open === 'from' ? (!!st.to && iso > st.to) : (!!st.from && iso < st.from);
      days.push({ n: String(d), label: self.__day(iso), pressed: on ? 'true' : 'false', vis: 'visible', bg: on ? '#4E2018' : 'transparent', fg: on ? '#FFFFFF' : off ? '#C9BFBA' : '#2E1712', fw: on ? '700' : '400',
        tap: off ? function () {} : function () { const o = { open: '' }; o[st.open] = iso; self.setState(o); } }); }
    return { month: names[m] + ' ' + y, days: days };
  }
  constructor(props) {
    super(props);
    let col = '';
    try { const m = /sammlung=([a-z0-9]+)/.exec(String(window.location.hash || '')); if (m && this.__cols().indexOf(m[1]) >= 0) col = m[1]; } catch (e) {}
    this.state = { col: col, people: [], from: '', to: '', open: '', ym: '' };
  }
  componentDidMount() { // a tile ticked by the hash is brought into view
    try { const n = this.state.col ? document.getElementById('p5bk-col-' + this.state.col) : null; const r = n ? n.parentNode : null;
      if (n && r) r.scrollLeft = Math.max(0, n.offsetLeft - r.offsetLeft - 20 - (350 - n.offsetWidth) / 2); } catch (e) {}
  }
  renderVals() {
    const self = this; const st = this.state; const cal = this.__cal();
    const v = {}; const sel = '0 0 0 2px #FFFFFF, 0 0 0 4px #4E2018';
    this.__cols().forEach(function (id, i) { const on = st.col === id; const k = 'c' + i;
      v[k + 'on'] = on; v[k + 'pressed'] = on ? 'true' : 'false'; v[k + 'ring'] = on ? sel : 'none'; v[k + 'tap'] = function () { self.setState({ col: on ? '' : id }); }; });
    this.__people().forEach(function (id, i) { const on = st.people.indexOf(id) >= 0; const k = 'p' + i;
      v[k + 'on'] = on; v[k + 'pressed'] = on ? 'true' : 'false'; v[k + 'ring'] = on ? sel : 'none';
      v[k + 'tap'] = function () { const x = st.people.slice(); const j = x.indexOf(id); if (j >= 0) x.splice(j, 1); else x.push(id); self.setState({ people: x }); }; });
    return Object.assign(v, {
      fromTxt: this.__day(st.from) || 'Anfang', fromFg: st.from ? '#2E1712' : '#8C746A',
      toTxt: this.__day(st.to) || 'Für immer', toFg: st.to ? '#2E1712' : '#8C746A',
      fromOpen: function () { self.__open('from'); }, toOpen: function () { self.__open('to'); },
