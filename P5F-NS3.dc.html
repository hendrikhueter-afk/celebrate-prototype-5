<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Celebrate</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBF8F4">
<style>html{height:100%;overflow:hidden;background:#FBF8F4;display:flex;align-items:center;justify-content:center}body{flex:none;width:390px;height:var(--h,844px);overflow:hidden;zoom:var(--z,1)}</style>
<script>(function(){var lw=0;function f(){var w=innerWidth,h=innerHeight;if(w===lw)return;lw=w;var z=w/390,H=h/z;if(H<640){z=h/640;H=640}var r=document.documentElement.style;r.setProperty("--z",z);r.setProperty("--h",Math.floor(H)+"px")}f();addEventListener("resize",f);addEventListener("orientationchange",function(){lw=0;setTimeout(f,300)})})();</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&amp;display=swap">
<style>
img{filter:saturate(1.1) brightness(1.12) contrast(1.05)}
body{margin:0;background:#FFFFFF}
a{color:#2E1712;text-decoration:none}a:hover{color:#2E1712}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:999px;background:#4E2018;color:#ffffff;font-weight:700;font-size:16px;border:0;font-family:inherit;cursor:pointer;text-decoration:none;box-sizing:border-box}
.btn:hover{color:#ffffff}
.soft{background:#F2F1F0;color:#2E1712}.soft:hover{color:#2E1712}
.pf{display:flex;flex-direction:column;align-items:center;gap:8px;width:64px;flex-shrink:0;padding:0;margin:0;border:0;background:none;font-family:inherit;color:#2E1712;cursor:pointer}
.face{display:block;flex-shrink:0;position:relative;overflow:hidden;border-radius:50%;background:#E2D9D6}
.fc{position:absolute;height:auto;max-width:none;display:block}
.chip{height:44px;padding:0 16px;border:0;border-radius:22px;font-family:inherit;font-size:16px;line-height:20px;font-weight:500;cursor:pointer;transition:background-color 0.14s ease, color 0.14s ease}
.nsname::placeholder{color:#8C746A;opacity:1}
.nsrow{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0 18px;border:0;background:none;font-family:inherit;cursor:pointer;box-sizing:border-box}
.day{height:44px;border:0;border-radius:22px;padding:0;font-family:inherit;font-size:17px;line-height:22px;cursor:pointer}
.nav{width:44px;height:44px;border:0;border-radius:22px;background:none;color:#2E1712;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.chip{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: var(--h, 844px); box-sizing: border-box; background: #FFFFFF; color: #2E1712; font-family: 'Rubik', system-ui, sans-serif; position: relative; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 44px; height: 44px; padding: 0 14px; display: flex; align-items: center; z-index: 4"><a href="{{back}}" aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2E1712"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; stroke-width: 2.2"><path d="M15 5l-7 7 7 7"></path></svg></a></div>
<div style="position: absolute; left: 20px; right: 20px; top: 104px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; color: #2E1712; text-align: center">Welche Fotos?</h1>
<div role="group" aria-label="Wer" style="display: flex; justify-content: center; gap: 22px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="4"><button type="button" class="pf" aria-pressed="{{p.pressed}}" aria-label="{{p.label}}" onClick="{{p.tap}}"><span style="position: relative; display: block; width: 64px; height: 64px; border-radius: 50%; box-shadow: {{p.ring}}"><span class="face" style="width: 64px; height: 64px"><img src="{{p.src}}" alt="" class="fc" style="width: {{p.w}}; left: {{p.l}}; top: {{p.t}}"></span><sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; right: -4px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: #4E2018; color: #FFFFFF; box-shadow: 0 0 0 2px #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 2.8"><path d="M5 12l4 4L19 6"></path></svg></span></sc-if></span><span style="font-size: 15px; line-height: 19px; font-weight: 500; color: #2E1712; white-space: nowrap">{{p.label}}</span></button></sc-for>
</div>
<div role="group" aria-label="Zeitraum" style="border-radius: 16px; background: #F2F1F0; overflow: hidden"><button type="button" class="nsrow" aria-label="Von" onClick="{{fromOpen}}"><span style="font-size: 17px; line-height: 22px; color: #2E1712">Von</span><span style="font-size: 17px; line-height: 22px; font-weight: 500; color: {{fromFg}}">{{fromTxt}}</span></button><span aria-hidden="true" style="display: block; height: 1px; margin: 0 18px; background: #E2D9D6"></span><button type="button" class="nsrow" aria-label="Bis" onClick="{{toOpen}}"><span style="font-size: 17px; line-height: 22px; color: #2E1712">Bis</span><span style="font-size: 17px; line-height: 22px; font-weight: 500; color: {{toFg}}">{{toTxt}}</span></button></div>
<input id="p5f-ns-place" class="nsname" type="text" placeholder="Ort, zum Beispiel Dänemark" aria-label="Ort" autocomplete="off" spellcheck="false" maxlength="40" enterkeyhint="done" onInput="{{onPlace}}" style="display: block; width: 100%; height: 56px; box-sizing: border-box; padding: 0 18px; border: 0; border-radius: 16px; background: #F2F1F0; font-family: inherit; font-size: 17px; line-height: 22px; color: #2E1712; caret-color: #4E2018; outline: none">
</div>
<a href="P5F-NS4.dc.html" onClick="{{done}}" class="btn" style="position: absolute; left: 20px; right: 20px; bottom: 34px">Fertig</a>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><div><button type="button" aria-label="Schließen" onClick="{{close}}" style="position: absolute; inset: 0; z-index: 10; border: 0; padding: 0; background: rgba(46,23,18,0.32); cursor: pointer"></button><div role="dialog" aria-label="{{calLabel}}" style="position: absolute; z-index: 11; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 14px 20px 34px; box-shadow: 0 -12px 40px rgba(0,0,0,0.18)"><div style="width: 40px; height: 5px; border-radius: 999px; background: #D9D5D2; margin: 0 auto 14px"></div><div style="display: flex; align-items: center; justify-content: space-between"><button type="button" class="nav" aria-label="Monat zurück" onClick="{{prev}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; stroke-width: 2.2"><path d="M15 5l-7 7 7 7"></path></svg></button><span style="font-size: 17px; line-height: 22px; font-weight: 700; color: #2E1712">{{month}}</span><button type="button" class="nav" aria-label="Monat vor" onClick="{{next}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 24px; height: 24px; stroke-width: 2.2"><path d="M9 5l7 7-7 7"></path></svg></button></div><div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin-top: 8px; font-size: 13px; line-height: 17px; color: #8C746A; text-align: center"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px 0; margin-top: 6px"><sc-for list="{{days}}" as="d" hint-placeholder-count="35"><button type="button" class="day" aria-label="{{d.label}}" aria-pressed="{{d.pressed}}" onClick="{{d.tap}}" style="visibility: {{d.vis}}; background: {{d.bg}}; color: {{d.fg}}; font-weight: {{d.fw}}">{{d.n}}</button></sc-for></div><button type="button" class="btn soft" onClick="{{clear}}" style="width: 100%; margin-top: 16px">{{clearTxt}}</button></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // "Automatisch befüllen" (Hendrik, 20 Nov): who is in the Sammlung (faces), the time range (Von, Bis; empty Von = from the
  // start, empty Bis = forever, so new photos keep coming in) and a place as free text (city or country).
  // Every pick is optional; Fertig works with no pick too: then the Sammlung takes all photos.
  // Fertig stores p5fnsauto = { people: [], places: [], themes: [], from: 'yyyy-mm-dd' or '', to: same, place: 'typed text' }
  // and opens the filled Sammlung P5F-NS4. places holds the place tags the typed text matches (P5F-NS4 filters on them);
  // the dates are stored but the sample photos carry no dates, so they do not narrow the result in the prototype.
  __people() { return [
      { id: 'hanne', label: 'Hanne', src: 'img/62c95a789594ee7ca512fe8877eed8e0.jpg', w: '150%', l: '-21%', t: '-18%' },
      { id: 'theo', label: 'Theo', src: 'img/9f8ac47fc93a6aaa1c39f72464370b8c.jpg', w: '190%', l: '-48%', t: '-50%' },
      { id: 'lukas', label: 'Lukas', src: 'img/03d7c0bfa1844716e6aa6b7f0b91ae88.jpg', w: '160%', l: '-23.2%', t: '-42%' },
      { id: 'ich', label: 'Ich', src: 'img/8cf0d595ab1f6813c6f743c8fe2df920.jpg', w: '172.3%', l: '-27.9%', t: '-40.4%' }
  ]; }
  __places() { return [{ id: 'zuhause', label: 'Zuhause' }, { id: 'zoo', label: 'Zoo' }, { id: 'park', label: 'Park' }, { id: 'strand', label: 'Strand' }]; }
  __val(id) { try { const n = document.getElementById(id); return n ? String(n.value || '').trim() : ''; } catch (e) { return ''; } }
  __day(v) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); if (!m) return ''; return Number(m[3]) + '. ' + ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sep.', 'Okt.', 'Nov.', 'Dez.'][Number(m[2]) - 1] + ' ' + m[1]; }
  __match(t) { t = String(t || '').toLowerCase(); if (!t) return []; return this.__places().filter(function (p) { return p.label.toLowerCase().indexOf(t) >= 0 || t.indexOf(p.label.toLowerCase()) >= 0; }).map(function (p) { return p.id; }); }
  // Own date picker (a sheet with one month): the native picker does not open inside the canvas or the click-through frame.
  __pad(n) { return (n < 10 ? '0' : '') + n; }
  __open(which) { const v = this.state[which] || this.state.from || this.state.to; const t = new Date(); this.setState({ open: which, ym: v ? v.slice(0, 7) : t.getFullYear() + '-' + this.__pad(t.getMonth() + 1) }); }
  __shift(ym, by) { const p = String(ym).split('-'); const d = new Date(Number(p[0]), Number(p[1]) - 1 + by, 1); return d.getFullYear() + '-' + this.__pad(d.getMonth() + 1); }
  __cal() {
    const self = this; const st = this.state; if (!st.open || !st.ym) return { month: '', days: [] };
    const p = st.ym.split('-'); const y = Number(p[0]); const m = Number(p[1]) - 1;
    const names = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const lead = (new Date(y, m, 1).getDay() + 6) % 7; const count = new Date(y, m + 1, 0).getDate(); const sel = st[st.open]; const days = [];
    for (let i = 0; i < lead; i++) days.push({ n: '', label: '', pressed: 'false', vis: 'hidden', bg: 'transparent', fg: '#2E1712', fw: '400', tap: function () {} });
    for (let d = 1; d <= count; d++) { const iso = st.ym + '-' + self.__pad(d); const on = iso === sel;
      // a day outside the other bound cannot be picked (Von after Bis, Bis before Von)
      const off = st.open === 'from' ? (!!st.to && iso > st.to) : (!!st.from && iso < st.from);
      days.push({ n: String(d), label: self.__day(iso), pressed: on ? 'true' : 'false', vis: 'visible', bg: on ? '#4E2018' : 'transparent', fg: on ? '#FFFFFF' : off ? '#C9BFBA' : '#2E1712', fw: on ? '700' : '400',
        tap: off ? function () {} : function () { const o = { open: '' }; o[st.open] = iso; self.setState(o); } }); }
    return { month: names[m] + ' ' + y, days: days };
  }
  // Edit mode (#edit, from P5F-NS1 in edit mode): the stored picks show again and back returns to the edit screen.
  __edit() { try { return String(window.location.hash || '').indexOf('edit') >= 0; } catch (e) { return false; } }
  __from() { try { return String(document.referrer || '').split('#')[0].split('?')[0].split('/').pop() || ''; } catch (e) { return ''; } }
  constructor(props) {
    super(props);
    // back from the filled Sammlung: keep the picks; any other way in starts empty
    let a = null; try { if (this.__edit() || this.__from() === 'P5F-NS4.dc.html') a = JSON.parse(window.sessionStorage.getItem('p5fnsauto') || 'null'); } catch (e) {}
    const arr = function (x) { return Array.isArray(x) ? x.slice() : []; };
    const str = function (x) { return typeof x === 'string' ? x : ''; };
    this.state = a && typeof a === 'object' ? { people: arr(a.people), from: str(a.from), to: str(a.to), place: str(a.place), open: '', ym: '' } : { people: [], from: '', to: '', place: '', open: '', ym: '' };
  }
  componentDidMount() { const st = this.state; const set = function (id, v) { try { const n = document.getElementById(id); if (n && v) n.value = v; } catch (e) {} }; set('p5f-ns-place', st.place);
  }
  __flip(group, id) { const x = this.state[group].slice(); const i = x.indexOf(id); if (i >= 0) x.splice(i, 1); else x.push(id); const o = {}; o[group] = x; this.setState(o); }
  renderVals() {
    const self = this; const st = this.state;
    const cal = this.__cal();
    const people = this.__people().map(function (p) { const on = st.people.indexOf(p.id) >= 0;
      return Object.assign({}, p, { on: on, pressed: on ? 'true' : 'false', ring: on ? '0 0 0 2px #FFFFFF, 0 0 0 4px #4E2018' : 'none', tap: function () { self.__flip('people', p.id); } }); });
    return {
      people: people, back: this.__edit() ? 'P5F-NS1.dc.html#edit' : 'P5F-NS1.dc.html',
      fromTxt: this.__day(st.from) || 'Anfang', fromFg: st.from ? '#2E1712' : '#8C746A',
      toTxt: this.__day(st.to) || 'Für immer', toFg: st.to ? '#2E1712' : '#8C746A',
      fromOpen: function () { self.__open('from'); }, toOpen: function () { self.__open('to'); },
      open: !!st.open, calLabel: st.open === 'to' ? 'Bis' : 'Von', month: cal.month, days: cal.days,
      clearTxt: st.open === 'to' ? 'Für immer' : 'Von Anfang an',
      close: function () { self.setState({ open: '' }); },
      clear: function () { const o = { open: '' }; o[st.open] = ''; self.setState(o); },
      prev: function () { self.setState({ ym: self.__shift(st.ym, -1) }); }, next: function () { self.setState({ ym: self.__shift(st.ym, 1) }); },
      onPlace: function () {},
      done: function (e) {
        const place = self.__val('p5f-ns-place');
        try { window.sessionStorage.setItem('p5fnsauto', JSON.stringify({ people: st.people, places: self.__match(place), themes: [], from: st.from, to: st.to, place: place })); } catch (x) {}
      }
    };
  }
}
</script>
</body>
</html>
